<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>溯源二维码 · VegetableChain Tech</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep: #050510;
      --neon-cyan: #00d4ff;
      --neon-purple: #b400ff;
      --neon-green: #00ff88;
      --text: #e0e8ff;
      --text-bright: #ffffff;
      --text-dim: #7a88b8;
      --card-bg: rgba(15, 20, 45, 0.6);
      --card-border: rgba(0, 212, 255, 0.25);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text); background: var(--bg-deep);
      min-height: 100vh; overflow-x: hidden; position: relative;
    }
    #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .container { max-width: 500px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 24px; }
    .logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav a { color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 6px 14px; border-radius: 20px; border: 1px solid transparent; transition: all 0.3s; }
    .nav a:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }
    .page-title { font-size: 24px; font-weight: 900; text-align: center; background: linear-gradient(135deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .page-sub { text-align: center; color: var(--text-dim); font-size: 13px; margin: 6px 0 28px; }

    .qr-card {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--card-border); border-radius: 24px;
      padding: 36px 28px; text-align: center; position: relative; overflow: hidden;
    }
    .qr-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent); }

    .qr-wrap {
      width: 240px; height: 240px; margin: 0 auto 24px;
      background: #fff; padding: 16px; border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
      position: relative;
    }
    .qr-wrap::after {
      content: ""; position: absolute; inset: -3px;
      border-radius: 18px; padding: 3px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }
    #qrcode { width: 100%; height: 100%; }

    .veg-name { font-size: 20px; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
    .veg-id { color: var(--neon-cyan); font-family: monospace; font-size: 13px; margin-bottom: 20px; }

    .scan-tip {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px; padding: 14px;
      font-size: 13px; color: var(--text-dim); line-height: 1.7;
      margin-top: 20px;
    }
    .scan-tip strong { color: var(--neon-cyan); }

    .info-row {
      display: flex; justify-content: space-between; padding: 10px 0;
      border-bottom: 1px solid rgba(0, 212, 255, 0.08);
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .l { color: var(--text-dim); }
    .info-row .r { color: var(--text-bright); font-weight: 500; }
    .info-row .r.mono { font-family: monospace; font-size: 12px; color: var(--neon-cyan); word-break: break-all; text-align: right; }

    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
    .btn {
      padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 700;
      text-decoration: none; border: none; cursor: pointer; transition: all 0.3s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(180, 0, 255, 0.4); }
    .btn-outline { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
    .btn-outline:hover { background: rgba(0, 212, 255, 0.1); }

    .footer { padding: 30px 0; text-align: center; color: var(--text-dim); font-size: 12px; border-top: 1px solid var(--card-border); margin-top: 28px; }
    .footer a { color: var(--neon-cyan); text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <nav class="nav">
      <div class="logo">VegetableChain</div>
      <div><a href="./detail.html">返回</a> <a href="../qrcode.html" style="margin-left:8px;">标准版 ↗</a></div>
    </nav>
    <h1 class="page-title">溯源二维码</h1>
    <p class="page-sub">扫码即可验证蔬菜档案真伪</p>

    <div class="qr-card">
      <div class="qr-wrap">
        <div id="qrcode"></div>
      </div>
      <div class="veg-name">🍅 普罗旺斯番茄</div>
      <div class="veg-id">TOM-2026-000001</div>

      <div style="text-align: left; margin-top: 20px;">
        <div class="info-row"><span class="l">区块链</span><span class="r">FISCO BCOS v2.9.1</span></div>
        <div class="info-row"><span class="l">共识机制</span><span class="r">PBFT · 4节点</span></div>
        <div class="info-row"><span class="l">合约地址</span><span class="r mono">0x522a...72a9</span></div>
        <div class="info-row"><span class="l">区块高度</span><span class="r">#2</span></div>
      </div>

      <div class="scan-tip">
        💡 <strong>扫码提示：</strong>用手机微信/相机扫描二维码，即可查看蔬菜的完整链上档案，并验证数据完整性。
      </div>
    </div>

    <div class="btn-row">
      <a href="./detail.html" class="btn btn-primary">查看档案详情 →</a>
      <a href="./verify.html" class="btn btn-outline">验证数据</a>
    </div>

    <footer class="footer">
      <p>VegetableChain · 科技版 · 基于 FISCO BCOS 联盟链</p>
      <p style="margin-top:6px;"><a href="../qrcode.html">查看标准版</a></p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const url = window.location.href.replace('/tech/qrcode.html', '/tech/detail.html');
    new QRCode(document.getElementById('qrcode'), {
      text: url,
      width: 208,
      height: 208,
      colorDark: '#0a0a1f',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    // 粒子
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let p = [], w, h;
      function r() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
      r(); addEventListener('resize', r);
      function init() {
        p = []; const n = Math.min(40, Math.floor(w*h/25000));
        for (let i=0; i<n; i++) p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,r:Math.random()*2+0.5,c:Math.random()>0.5?'0,212,255':'180,0,255'});
      }
      init();
      function d() {
        ctx.clearRect(0,0,w,h);
        for (let x of p) {
          x.x+=x.vx; x.y+=x.vy;
          if (x.x<0||x.x>w) x.vx*=-1; if (x.y<0||x.y>h) x.vy*=-1;
          ctx.beginPath(); ctx.arc(x.x,x.y,x.r,0,Math.PI*2);
          ctx.fillStyle=`rgba(${x.c},0.4)`; ctx.fill();
        }
        requestAnimationFrame(d);
      }
      d();
    })();
  </script>
</body>
</html>
