<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <title>溯源二维码 · VegetableChain Sci-Fi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep: #05070d;
      --glow-green: #39ff7a;
      --glow-cyan: #00d4ff;
      --glow-gold: #c9a961;
      --text-primary: #e8f0ff;
      --text-secondary: #8fa3c7;
      --text-muted: #4a5a7a;
      --glass-bg: rgba(15, 22, 38, 0.55);
      --glass-border: rgba(100, 160, 255, 0.15);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-primary); background: var(--bg-deep);
      min-height: 100vh; overflow-x: hidden; position: relative;
    }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .grid-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
      background-image: linear-gradient(rgba(0, 212, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.025) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .container { position: relative; z-index: 10; max-width: 500px; margin: 0 auto; padding: 0 20px; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; position: relative; }
    .nav::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--glass-border), transparent); }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; letter-spacing: 2px; }
    .logo-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--glow-green), var(--glow-cyan)); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #05070d; font-weight: 900; box-shadow: 0 0 15px rgba(57, 255, 122, 0.4); }
    .logo-text { background: linear-gradient(135deg, var(--glow-green), var(--glow-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-right a { color: var(--text-secondary); text-decoration: none; font-size: 12px; padding: 7px 14px; border-radius: 7px; border: 1px solid transparent; transition: all 0.3s; margin-left: 4px; }
    .nav-right a:hover { color: var(--glow-cyan); border-color: var(--glass-border); background: rgba(0,212,255,0.08); }

    .page-header { padding: 28px 0 20px; text-align: center; }
    .page-tag { display: inline-block; padding: 5px 16px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 2px; background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.3); color: var(--glow-cyan); margin-bottom: 14px; }
    .page-title { font-size: clamp(22px, 4vw, 28px); font-weight: 900; background: linear-gradient(135deg, #fff, var(--glow-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .page-sub { color: var(--text-secondary); font-size: 12px; margin-top: 6px; }

    .qr-card {
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 20px;
      padding: 32px 28px; text-align: center; position: relative; overflow: hidden;
    }
    .qr-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--glow-green), var(--glow-cyan), transparent);
    }

    .qr-wrap {
      position: relative;
      width: 220px; height: 220px; margin: 0 auto 24px;
      padding: 12px; background: #fff; border-radius: 14px;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.25);
    }
    .qr-wrap::after {
      content: ""; position: absolute; inset: -2px; border-radius: 16px; padding: 2px;
      background: linear-gradient(135deg, var(--glow-green), var(--glow-cyan), var(--glow-gold));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
      animation: borderGlow 3s ease-in-out infinite;
    }
    @keyframes borderGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    #qrcode { width: 100%; height: 100%; }

    .veg-name { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .veg-id { color: var(--glow-cyan); font-family: monospace; font-size: 13px; margin-bottom: 20px; }

    .info-list { text-align: left; margin-top: 20px; }
    .info-row {
      display: flex; justify-content: space-between; padding: 9px 0;
      border-bottom: 1px solid rgba(0, 212, 255, 0.08); font-size: 12px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .l { color: var(--text-muted); }
    .info-row .r { color: var(--text-primary); font-weight: 500; }
    .info-row .r.mono { font-family: monospace; font-size: 11px; color: var(--glow-cyan); word-break: break-all; text-align: right; }

    .scan-tip {
      background: rgba(0, 212, 255, 0.06);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 10px; padding: 14px;
      font-size: 12px; color: var(--text-secondary); line-height: 1.7;
      margin-top: 18px; text-align: left;
    }
    .scan-tip strong { color: var(--glow-green); }

    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .btn { padding: 12px 22px; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, var(--glow-green), var(--glow-cyan)); color: #05070d; box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(57, 255, 122, 0.4); }
    .btn-glass { background: var(--glass-bg); backdrop-filter: blur(10px); color: var(--glow-cyan); border: 1px solid var(--glass-border); }
    .btn-glass:hover { background: rgba(0, 212, 255, 0.1); border-color: var(--glow-cyan); }

    .footer { padding: 30px 0; text-align: center; color: var(--text-muted); font-size: 11px; border-top: 1px solid var(--glass-border); margin-top: 24px; }
    .footer a { color: var(--glow-cyan); text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="grid-overlay"></div>
  <div class="container">
    <nav class="nav">
      <div class="logo"><div class="logo-mark">V</div><span class="logo-text">VEGETABLECHAIN</span></div>
      <div class="nav-right">
        <a href="./detail.html">返回</a>
        <a href="../qrcode.html">标准版 ↗</a>
      </div>
    </nav>

    <div class="page-header">
      <div class="page-tag">QR CODE</div>
      <h1 class="page-title">溯源二维码</h1>
      <p class="page-sub">扫码即可验证蔬菜档案真伪</p>
    </div>

    <div class="qr-card">
      <div class="qr-wrap">
        <div id="qrcode"></div>
      </div>
      <div class="veg-name">🍅 普罗旺斯番茄</div>
      <div class="veg-id">TOM-2026-000001</div>

      <div class="info-list">
        <div class="info-row"><span class="l">区块链</span><span class="r">FISCO BCOS v2.9.1</span></div>
        <div class="info-row"><span class="l">共识机制</span><span class="r">PBFT · 4节点</span></div>
        <div class="info-row"><span class="l">合约地址</span><span class="r mono">0x522a...72a9</span></div>
        <div class="info-row"><span class="l">区块高度</span><span class="r">#2</span></div>
        <div class="info-row"><span class="l">存证时间</span><span class="r">2026-09-20</span></div>
      </div>

      <div class="scan-tip">
        💡 <strong>扫码提示：</strong>用手机微信/相机扫描二维码，即可查看蔬菜的完整链上档案，并验证数据完整性。
      </div>
    </div>

    <div class="btn-row">
      <a href="./detail.html" class="btn btn-primary">查看档案详情 →</a>
      <a href="./verify.html" class="btn btn-glass">验证数据</a>
    </div>

    <footer class="footer">
      <p>VegetableChain · 科幻版 · 基于 FISCO BCOS 联盟链</p>
      <p style="margin-top:6px;"><a href="../qrcode.html">查看标准版</a></p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    const url = window.location.href.replace('/scifi/qrcode.html', '/scifi/detail.html');
    new QRCode(document.getElementById('qrcode'), {
      text: url, width: 196, height: 196,
      colorDark: '#090d16', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    (function() {
      const canvas = document.getElementById('bg-canvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
      camera.position.z = 1;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      const N = 350;
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        pos[i*3] = (Math.random()-0.5)*4; pos[i*3+1] = (Math.random()-0.5)*3; pos[i*3+2] = Math.random()*-2;
        const r = Math.random();
        if (r < 0.6) { col[i*3]=0.7; col[i*3+1]=0.85; col[i*3+2]=1; }
        else if (r < 0.85) { col[i*3]=0.3; col[i*3+1]=1; col[i*3+2]=0.6; }
        else { col[i*3]=0.9; col[i*3+1]=0.8; col[i*3+2]=0.5; }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({ size: 0.006, vertexColors: true, transparent: true, opacity: 0.6 });
      const stars = new THREE.Points(geo, mat);
      scene.add(stars);
      let t = 0;
      function anim() { requestAnimationFrame(anim); t += 0.0003; stars.rotation.y = t; renderer.render(scene, camera); }
      anim();
      addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    })();
  </script>
</body>
</html>
